<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Заявка в офис</h3>
    <input type="text" id="name" placeholder="Ваше имя">
    <input type="tel" id="phone" placeholder="Номер телефона">
    <select id="office">
        <option value="central">Центральный офис</option>
        <option value="north">Северный филиал</option>
    </select>
    <button id="send">Отправить заявку</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на всё окно

        document.getElementById('send').addEventListener('click', function() {
            let data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                office: document.getElementById('office').value
            };
            tg.sendData(JSON.stringify(data)); // Отправляет данные обратно боту
            tg.close(); // Закрывает веб-приложение
        });
    </script>
</body>
</html>
